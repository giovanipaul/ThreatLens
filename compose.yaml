services:
  threatlens:
    build: .
    ports:
      - "8000:8000"
    environment:
      THREATLENS_DATABASE_URL: sqlite:////app/data/threatlens.db
      THREATLENS_ADMIN_USERNAME: ${THREATLENS_ADMIN_USERNAME:?Set THREATLENS_ADMIN_USERNAME}
      THREATLENS_ADMIN_PASSWORD: ${THREATLENS_ADMIN_PASSWORD:?Set THREATLENS_ADMIN_PASSWORD}
      THREATLENS_SECURE_COOKIES: ${THREATLENS_SECURE_COOKIES:-false}
      BRUTE_FORCE_THRESHOLD: ${BRUTE_FORCE_THRESHOLD:-5}
      BRUTE_FORCE_WINDOW_SECONDS: ${BRUTE_FORCE_WINDOW_SECONDS:-300}
      PASSWORD_SPRAY_USER_THRESHOLD: ${PASSWORD_SPRAY_USER_THRESHOLD:-5}
      PASSWORD_SPRAY_WINDOW_SECONDS: ${PASSWORD_SPRAY_WINDOW_SECONDS:-600}
      SUSPICIOUS_SUCCESS_FAILURE_THRESHOLD: ${SUSPICIOUS_SUCCESS_FAILURE_THRESHOLD:-3}
      SUSPICIOUS_SUCCESS_WINDOW_SECONDS: ${SUSPICIOUS_SUCCESS_WINDOW_SECONDS:-600}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-2}
      MAX_LOG_LINES: ${MAX_LOG_LINES:-50000}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
