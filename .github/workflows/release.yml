name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: giovanipaul/threatlens

jobs:
  verify-and-publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: threatlens
          POSTGRES_PASSWORD: threatlens-test
          POSTGRES_DB: threatlens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U threatlens -d threatlens_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate semantic version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies and scanners
        run: >-
          python -m pip install
          -r requirements.txt
          bandit==1.9.4
          pip-audit==2.10.1

      - name: Run Ruff
        run: python -m ruff check app tests

      - name: Run tests with coverage
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://threatlens:threatlens-test@localhost:5432/threatlens_test
        run: >-
          python -m pytest
          --cov=app
          --cov-report=term-missing
          --cov-fail-under=95
          -q

      - name: Scan Python source
        run: python -m bandit -r app -q

      - name: Audit pinned dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate container metadata
        id: metadata
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and publish container
        id: publish
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: THREATLENS_VERSION=${{ github.ref_name }}

      - name: Attest container provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          --verify-tag
          --generate-notes
          --title "ThreatLens ${GITHUB_REF_NAME}"
