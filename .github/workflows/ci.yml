name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: threatlens
          POSTGRES_PASSWORD: threatlens-test
          POSTGRES_DB: threatlens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U threatlens -d threatlens_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Ruff
        run: python -m ruff check app tests

      - name: Run tests with coverage
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://threatlens:threatlens-test@localhost:5432/threatlens_test
        run: >-
          python -m pytest
          --cov=app
          --cov-report=term-missing
          --cov-fail-under=95
          -q

      - name: Build Docker image
        run: docker build -t threatlens:ci .
